[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reconhecimento_facial"
version = "0.0.1"
description = "istema de controle de acesso utilizando reconhecimento facial"
authors = [
  { name = "Tiago Prysthon" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "deepface[tensorflow]>=0.0.101",
    "ipython",
    "jupyterlab",
    "keras>=3.15.1",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "opencv-python>=5.0.0.93",
    "pandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["reconhecimento_facial"]
include = ["pyproject.toml", "reconhecimento_facial/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["reconhecimento_facial"]
force-sort-within-sections = true

